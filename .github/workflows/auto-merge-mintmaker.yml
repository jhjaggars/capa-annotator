name: Auto-merge MintMaker PRs

on:
  pull_request_target:
    types: [opened, synchronize, labeled, unlabeled, reopened]
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Note: Author check is done in "Get PR details" step to avoid job-level condition issues

    steps:
      - name: Get PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            # For workflow_run events, find the PR associated with the workflow run
            PR_NUMBER=$(gh pr list --repo ${{ github.repository }} --head ${{ github.event.workflow_run.head_branch }} --json number --jq '.[0].number')
            echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi

      - name: Get PR details
        id: pr_details
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_DATA=$(gh pr view ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --json author,title,body,labels,state)

          # Check if PR author is MintMaker bot
          AUTHOR=$(echo "$PR_DATA" | jq -r '.author.login')
          if [ "$AUTHOR" != "app/red-hat-konflux-kflux-prd-rh03" ]; then
            echo "Not a MintMaker PR, skipping"
            echo "is_mintmaker=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "is_mintmaker=true" >> $GITHUB_OUTPUT
          echo "title=$(echo "$PR_DATA" | jq -r '.title')" >> $GITHUB_OUTPUT
          echo "state=$(echo "$PR_DATA" | jq -r '.state')" >> $GITHUB_OUTPUT

          # Check for no-automerge label
          HAS_NO_AUTOMERGE=$(echo "$PR_DATA" | jq -r '.labels[] | select(.name == "no-automerge") | .name' | wc -l)
          if [ "$HAS_NO_AUTOMERGE" -gt 0 ]; then
            echo "has_no_automerge=true" >> $GITHUB_OUTPUT
            echo "PR has no-automerge label, skipping auto-merge"
          else
            echo "has_no_automerge=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect version change type
        id: version_check
        if: steps.pr_details.outputs.is_mintmaker == 'true' && steps.pr_details.outputs.has_no_automerge == 'false' && steps.pr_details.outputs.state == 'OPEN'
        run: |
          TITLE="${{ steps.pr_details.outputs.title }}"
          echo "Checking PR title: $TITLE"

          # Check if this is a digest/hash update (e.g., "update X digest to abc123")
          # These are safe to auto-merge as they're typically minor updates
          if echo "$TITLE" | grep -qiE "(digest|commit|hash) to [a-f0-9]+"; then
            echo "Digest/hash update detected, eligible for auto-merge"
            echo "is_major=false" >> $GITHUB_OUTPUT
            echo "reason=digest_update" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Look for semantic version patterns in the title
          # Patterns: "v1.2.3 to v2.0.0", "1.2.3 to 2.0.0", "module X to v1.2.3", etc.
          FROM_VERSION=$(echo "$TITLE" | grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+' | head -1 | sed 's/^v//')
          TO_VERSION=$(echo "$TITLE" | grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+' | tail -1 | sed 's/^v//')

          echo "From version: $FROM_VERSION"
          echo "To version: $TO_VERSION"

          if [ -z "$FROM_VERSION" ] || [ -z "$TO_VERSION" ]; then
            echo "Could not parse semantic version, defaulting to manual review"
            echo "is_major=true" >> $GITHUB_OUTPUT
            echo "reason=version_parse_failed" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract major versions
          FROM_MAJOR=$(echo "$FROM_VERSION" | cut -d. -f1)
          TO_MAJOR=$(echo "$TO_VERSION" | cut -d. -f1)

          echo "From major: $FROM_MAJOR"
          echo "To major: $TO_MAJOR"

          if [ "$FROM_MAJOR" != "$TO_MAJOR" ]; then
            echo "Major version change detected ($FROM_MAJOR -> $TO_MAJOR), skipping auto-merge"
            echo "is_major=true" >> $GITHUB_OUTPUT
            echo "reason=major_version_change" >> $GITHUB_OUTPUT
          else
            echo "Minor or patch update detected, eligible for auto-merge"
            echo "is_major=false" >> $GITHUB_OUTPUT
            echo "reason=minor_or_patch" >> $GITHUB_OUTPUT
          fi

      - name: Wait for required checks
        id: checks
        if: steps.pr_details.outputs.is_mintmaker == 'true' && steps.pr_details.outputs.has_no_automerge == 'false' && steps.version_check.outputs.is_major == 'false' && steps.pr_details.outputs.state == 'OPEN'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the latest commit SHA for the PR
          COMMIT_SHA=$(gh pr view ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --json headRefOid --jq '.headRefOid')
          echo "Checking commit: $COMMIT_SHA"

          # Wait for checks to complete (with timeout)
          MAX_WAIT=300  # 5 minutes
          WAITED=0
          INTERVAL=10

          while [ $WAITED -lt $MAX_WAIT ]; do
            # Get check runs for the commit
            CHECK_STATUS=$(gh api repos/${{ github.repository }}/commits/$COMMIT_SHA/check-runs --jq '.check_runs | map(select(.name | IN("Run Tests", "Integration Tests", "Lint", "Build"))) | if length == 0 then "none" elif all(.status == "completed") then (if all(.conclusion == "success") then "success" else "failure" end) else "pending" end')

            echo "Check status: $CHECK_STATUS (waited ${WAITED}s)"

            if [ "$CHECK_STATUS" = "success" ]; then
              echo "All required checks passed"
              echo "checks_passed=true" >> $GITHUB_OUTPUT
              exit 0
            elif [ "$CHECK_STATUS" = "failure" ]; then
              echo "Some required checks failed"
              echo "checks_passed=false" >> $GITHUB_OUTPUT
              exit 0
            elif [ "$CHECK_STATUS" = "none" ]; then
              echo "No required checks found yet, will enable auto-merge and let GitHub handle it"
              echo "checks_passed=pending" >> $GITHUB_OUTPUT
              exit 0
            fi

            sleep $INTERVAL
            WAITED=$((WAITED + INTERVAL))
          done

          echo "Timeout waiting for checks, will enable auto-merge and let GitHub handle it"
          echo "checks_passed=pending" >> $GITHUB_OUTPUT

      - name: Enable auto-merge
        if: steps.pr_details.outputs.is_mintmaker == 'true' && steps.pr_details.outputs.has_no_automerge == 'false' && steps.version_check.outputs.is_major == 'false' && steps.pr_details.outputs.state == 'OPEN' && (steps.checks.outputs.checks_passed == 'true' || steps.checks.outputs.checks_passed == 'pending')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Enabling auto-merge for PR #${{ steps.pr.outputs.number }}"
          gh pr merge ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --auto --squash

          # Add a comment explaining the auto-merge
          gh pr comment ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --body "🤖 Auto-merge enabled for this MintMaker PR (detected as ${{ steps.version_check.outputs.reason }}). Will merge automatically when all required checks pass."

      - name: Add comment for major version changes
        if: steps.pr_details.outputs.is_mintmaker == 'true' && steps.version_check.outputs.is_major == 'true' && steps.pr_details.outputs.state == 'OPEN'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --body "⚠️ This PR contains a major version update and requires manual review before merging. Add the \`no-automerge\` label if you want to prevent auto-merge in the future."

      - name: Summary
        if: steps.pr_details.outputs.is_mintmaker == 'true'
        run: |
          echo "### Auto-merge Summary" >> $GITHUB_STEP_SUMMARY
          echo "- PR: #${{ steps.pr.outputs.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Title: ${{ steps.pr_details.outputs.title }}" >> $GITHUB_STEP_SUMMARY
          echo "- Has no-automerge label: ${{ steps.pr_details.outputs.has_no_automerge }}" >> $GITHUB_STEP_SUMMARY
          echo "- Is major version: ${{ steps.version_check.outputs.is_major }}" >> $GITHUB_STEP_SUMMARY
          echo "- Reason: ${{ steps.version_check.outputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "- Checks status: ${{ steps.checks.outputs.checks_passed }}" >> $GITHUB_STEP_SUMMARY
